name: Scriptable app

on:
  push:
    paths:
      - 'CalendarApp/Scriptable/**'
      - '.github/workflows/scriptable.yml'
  pull_request:
    paths:
      - 'CalendarApp/Scriptable/**'
      - '.github/workflows/scriptable.yml'
  workflow_dispatch:

jobs:
  test:
    name: Core, UI gestures and Scriptable runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: CalendarApp/Scriptable
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: CalendarApp/Scriptable/package-lock.json

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Core logic, dist/ up to date, touch-driven UI tests, and dist/一览.js in a fake Scriptable runtime
      - run: npm test
