name: Gatehouse

on:
  push:
    branches:
      - '**'
    paths:
      - 'Gatehouse/**'
      - '.github/workflows/gatehouse.yml'
    tags:
      - 'gatehouse-v*'
  pull_request:
    paths:
      - 'Gatehouse/**'
      - '.github/workflows/gatehouse.yml'
  workflow_dispatch:

# Least privilege by default; only the macOS job (which publishes the release
# on gatehouse-v* tags) gets write access to repository contents.
permissions:
  contents: read

defaults:
  run:
    working-directory: Gatehouse

jobs:
  test:
    name: Tests (Linux, real sshd)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Gatehouse/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: npm ci
      - run: npm run build:bridge
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Integration tests (OpenSSH server + MCP bridge)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo -E env "PATH=$PATH" npx vitest run --config vitest.integration.config.mts
      - name: End-to-end UI test (Electron + Playwright)
        run: |
          npm run build:main
          npx vite build --config vite.config.mts
          sudo apt-get install -y -qq xvfb
          # Playwright drives Electron directly; no browser download needed.
          npm install --no-save playwright@1.63.0
          sudo -E env "PATH=$PATH" xvfb-run -a node tests/e2e/ui.cjs "$RUNNER_TEMP/shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatehouse-screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

  mac:
    name: macOS app (arm64 + x64)
    needs: test
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Gatehouse/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false
      - run: npm ci
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/gatehouse-v')
        id: rel
        run: |
          version="${GITHUB_REF_NAME#gatehouse-v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag version: $version · package.json: $pkg"
          if [ "$version" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build bridge, main and renderer
        run: npm run build
      - name: Package (ad-hoc signed DMG + zip)
        run: npx electron-builder --mac --publish never
      - name: Verify code signatures
        run: |
          for arch in arm64 x64; do
            app="release/mac-$arch/Gatehouse.app"
            [ "$arch" = x64 ] && app="release/mac/Gatehouse.app"
            echo "== $app"
            codesign --verify --deep --strict --verbose=2 "$app"
            codesign -dv "$app" 2>&1 | grep -E 'Identifier|Signature|Format'
            codesign --verify --verbose=2 "$app/Contents/Resources/bin/gatehouse-mcp"
            echo "Gatehouse:   $(lipo -archs "$app/Contents/MacOS/Gatehouse")"
            echo "gatehouse-mcp: $(lipo -archs "$app/Contents/Resources/bin/gatehouse-mcp")"
          done
      - name: Verify hardening (Electron fuses, Info.plist, asar-only)
        run: |
          pkg=$(node -p "require('./package.json').version")
          for app in release/mac-arm64/Gatehouse.app release/mac/Gatehouse.app; do
            echo "== $app"
            plist="$app/Contents/Info.plist"
            ver=$(plutil -extract CFBundleShortVersionString raw "$plist")
            echo "version $ver · min macOS $(plutil -extract LSMinimumSystemVersion raw "$plist") · id $(plutil -extract CFBundleIdentifier raw "$plist")"
            [ "$ver" = "$pkg" ] || { echo "::error::bundle version $ver != package.json $pkg"; exit 1; }
            plutil -extract NSLocalNetworkUsageDescription raw "$plist" >/dev/null
            plutil -extract ElectronAsarIntegrity xml1 -o - "$plist" >/dev/null && echo "asar integrity hash: present"
            [ -f "$app/Contents/Resources/app.asar" ] && [ ! -d "$app/Contents/Resources/app" ] && echo "app code: asar only"
            node -e '
              const { getCurrentFuseWire, FuseV1Options } = require("@electron/fuses");
              const want = { RunAsNode: 0, EnableCookieEncryption: 1, EnableNodeOptionsEnvironmentVariable: 0,
                EnableNodeCliInspectArguments: 0, EnableEmbeddedAsarIntegrityValidation: 1, OnlyLoadAppFromAsar: 1,
                LoadBrowserProcessSpecificV8Snapshot: 0, GrantFileProtocolExtraPrivileges: 0 };
              getCurrentFuseWire(process.argv[1]).then((w) => {
                let bad = 0;
                for (const [k, exp] of Object.entries(want)) {
                  const v = w[FuseV1Options[k]];
                  const got = v === 49 ? 1 : v === 48 ? 0 : -1;
                  if (got !== exp) bad++;
                  console.log((got === exp ? "ok    " : "FAIL  ") + k + " = " + (got === 1 ? "on" : got === 0 ? "off" : "?"));
                }
                process.exit(bad ? 1 : 0);
              }).catch((e) => { console.error(e.message); process.exit(1); });
            ' "$app"
          done
      - name: Verify DMG images
        run: |
          for dmg in release/Gatehouse-*.dmg; do
            echo "== $dmg"
            hdiutil verify "$dmg"
          done
      - name: Checksums
        run: |
          cd release
          shasum -a 256 Gatehouse-*.dmg | tee SHA256SUMS.txt
      - name: Upload DMG (Apple Silicon)
        uses: actions/upload-artifact@v7
        with:
          path: Gatehouse/release/Gatehouse-*-arm64.dmg
          archive: false
          if-no-files-found: error
      - name: Upload DMG (Intel)
        uses: actions/upload-artifact@v7
        with:
          path: Gatehouse/release/Gatehouse-*-x64.dmg
          archive: false
          if-no-files-found: error
      - name: Smoke test the apps inside the DMGs
        run: |
          # Tests exactly what users download: mount each DMG, launch the app
          # from it, and drive a real MCP handshake through its bundled bridge.
          smoke() {
            local app="$1" label="$2" wait_s="$3"
            local home="$RUNNER_TEMP/gatehouse-home-$label"
            rm -rf "$home" && mkdir -p "$home"
            # Start like a first install: a vault key left in the login Keychain
            # by the other build (a different ad-hoc signature) would raise an
            # access prompt that nobody can answer on CI.
            for svc in "Gatehouse Safe Storage" "gatehouse Safe Storage"; do
              while security delete-generic-password -s "$svc" >/dev/null 2>&1; do :; done
            done
            GATEHOUSE_HOME="$home" "$app/Contents/MacOS/Gatehouse" --hidden > "$RUNNER_TEMP/app-$label.log" 2>&1 &
            local pid=$!
            local up=0
            for i in $(seq 1 "$wait_s"); do
              if [ -S "$home/run/mcp.sock" ]; then up=1; echo "$label: MCP socket up after ${i}s"; break; fi
              if ! kill -0 "$pid" 2>/dev/null; then echo "$label: app exited early"; break; fi
              sleep 1
            done
            if [ "$up" != 1 ]; then
              echo "::error::$label app did not open its MCP socket within ${wait_s}s"
              echo "--- $label app log"; tail -n 80 "$RUNNER_TEMP/app-$label.log" || true
              echo "--- processes"; ps -axo pid,etime,command | grep -i "[G]atehouse" || true
              kill "$pid" 2>/dev/null || true
              return 1
            fi
            GATEHOUSE_HOME="$home" "$app/Contents/Resources/bin/gatehouse-mcp" --doctor
            printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' \
              | (cat; sleep 3) | GATEHOUSE_HOME="$home" "$app/Contents/Resources/bin/gatehouse-mcp" --no-launch | tee "$RUNNER_TEMP/mcp-$label.out"
            grep -q '"run_command"' "$RUNNER_TEMP/mcp-$label.out"
            echo "tools reported: $(grep -o '"name":"[a-z_]*"' "$RUNNER_TEMP/mcp-$label.out" | sort -u | tr '\n' ' ')"
            kill "$pid" || true
            wait "$pid" 2>/dev/null || true
            echo "--- $label app log"; tail -n 20 "$RUNNER_TEMP/app-$label.log" || true
          }
          for arch in arm64 x64; do
            if [ "$arch" = x64 ] && ! arch -x86_64 /usr/bin/true 2>/dev/null; then
              echo "::notice::Rosetta 2 is not available on this runner; skipping the x64 launch test (signature and DMG checks above still covered it)."
              continue
            fi
            dmg=$(ls release/Gatehouse-*-"$arch".dmg)
            mnt=$(mktemp -d)
            echo "== $dmg"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
            # Rosetta translates the x64 Electron framework on first launch, so allow more time.
            smoke "$mnt/Gatehouse.app" "$arch" "$([ "$arch" = x64 ] && echo 300 || echo 120)"
            hdiutil detach "$mnt" || hdiutil detach -force "$mnt"
          done
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/gatehouse-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Gatehouse ${{ steps.rel.outputs.version }}
          body_path: Gatehouse/docs/release-notes/${{ github.ref_name }}.md
          files: |
            Gatehouse/release/Gatehouse-*-arm64.dmg
            Gatehouse/release/Gatehouse-*-x64.dmg
            Gatehouse/release/SHA256SUMS.txt
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          make_latest: true
