name: Android

on:
  push:
    paths:
      - 'FakeTravelerPlus/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'FakeTravelerPlus/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FakeTravelerPlus
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Unit tests and debug APK
        run: ./gradlew --no-configuration-cache testDebugUnitTest assembleDebug lintDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: FakeTravelerPlus/app/build/outputs/apk/debug/app-debug.apk
          archive: false # downloads as app-debug.apk instead of a zip
          if-no-files-found: error

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: FakeTravelerPlus/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
