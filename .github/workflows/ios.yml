name: iOS app

on:
  push:
    paths:
      - 'CalendarApp/**'
      - '.github/workflows/ios.yml'
  pull_request:
    paths:
      - 'CalendarApp/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  core-tests:
    name: Core logic tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v5
      - run: swift test --package-path CalendarApp/Packages/GlanceCore

  build:
    name: Build app and widget (Xcode)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Xcode version
        run: |
          xcodebuild -version
          # Report every compile error in one run instead of stopping at the first file
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: Core logic tests (macOS)
        run: swift test --package-path CalendarApp/Packages/GlanceCore

      - name: Build for iOS Simulator
        run: |
          xcodebuild -project CalendarApp/OneGlance.xcodeproj -scheme OneGlance \
            -configuration Debug -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build

      - name: Build for iPhone (unsigned)
        run: |
          xcodebuild -project CalendarApp/OneGlance.xcodeproj -scheme OneGlance \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO -quiet build
